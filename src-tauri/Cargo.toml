[package]
name = "akuntansi-app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "akuntansi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tracing = "0.1.44"
chrono = "0.4.45"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
rust_xlsxwriter = "0.102.0"
tauri-plugin-dialog = "2"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
typst-render = "0.15.1"
