# Cek lisensi dependency: hanya lisensi permisif yang boleh (aplikasi akan dijual).
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
version = 2
confidence-threshold = 0.9
# Crate aplikasi sendiri (proprietary, publish = false) tidak perlu lisensi terdaftar.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
  "BSL-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
# GPL / AGPL / LGPL tidak ada di daftar allow, jadi otomatis ditolak.

[advisories]
version = 2

[bans]
multiple-versions = "warn"
